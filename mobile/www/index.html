<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop</title>
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/instrument-serif-400.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:300;font-display:swap;src:url('assets/fonts/hanken-300.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/hanken-400.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/hanken-500.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:300;font-display:swap;src:url('assets/fonts/jetbrains-300.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/jetbrains-400.woff2') format('woff2')}
html,body{margin:0;height:100%;background:#000;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
input{font-family:inherit}input::placeholder{color:rgba(255,255,255,.26)}
#app *{scrollbar-width:none;-ms-overflow-style:none}
#app *::-webkit-scrollbar{width:0;height:0;display:none}
@keyframes pl-drift{0%,100%{transform:scale(1) rotate(0deg)}33%{transform:scale(1.03) rotate(4deg)}66%{transform:scale(.985) rotate(-3deg)}}
@keyframes pl-pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.25)}}
@keyframes pl-still{0%,100%{transform:scale(1);filter:brightness(.9)}50%{transform:scale(1.012);filter:brightness(1)}}
@keyframes pl-breathe{0%,100%{transform:scale(.94)}45%{transform:scale(1.08)}70%{transform:scale(1.01)}}
@keyframes pl-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pl-orbit{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.04)}100%{transform:rotate(360deg) scale(1)}}
@keyframes pl-halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.16)}}
@keyframes pl-halo-slow{0%,100%{opacity:.36;transform:scale(.96)}50%{opacity:.78;transform:scale(1.22)}}
@keyframes pl-halo-min{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.44;transform:scale(1.05)}}
@keyframes pl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pl-dot{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes pl-up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style></head>
<body>
<div id="app" style="height:100dvh;display:flex;flex-direction:column;position:relative;background:#000;overflow:hidden"></div>
<script src="engine.js"></script>
<script src="health-connect.js"></script>
<script>
var ASSET='assets/';
var STATES=[
 {id:'eq', tag:'EQUILIBRADO · CORPO EM HARMONIA', desc:'Seu corpo em harmonia.',   motion:'deriva 12s',   hex:'#63D471', src:ASSET+'orb-equilibrado.png', anim:'pl-drift 12s ease-in-out infinite',  halo:'pl-halo 8s ease-in-out infinite',      ga:.34, ta:.08,  la:.22},
 {id:'att',tag:'ATENÇÃO · SINAIS DE CARGA ALTA',  desc:'Sinais pedem atenção.',     motion:'pulso 3.6s',   hex:'#FFBA2A', src:ASSET+'orb-atencao.png',     anim:'pl-pulse 3.6s ease-in-out infinite', halo:'pl-halo 3.6s ease-in-out infinite',    ga:.32, ta:.075, la:.22},
 {id:'low',tag:'RECUPERAÇÃO BAIXA · 68%',         desc:'Hora de priorizar descanso.',motion:'quase parado', hex:'#EF4A3A', src:ASSET+'orb-baixa.png',       anim:'pl-still 11s ease-in-out infinite',  halo:'pl-halo-min 11s ease-in-out infinite', ga:.28, ta:.07,  la:.2},
 {id:'foc',tag:'FOCO · CONCENTRAÇÃO MÁXIMA',      desc:'Concentração máxima.',      motion:'giro 30s',     hex:'#5DA8FF', src:ASSET+'orb-foco.png',        anim:'pl-spin 30s linear infinite',        halo:'pl-halo-slow 10s ease-in-out infinite',ga:.3,  ta:.075, la:.2},
 {id:'ana',tag:'ANALISANDO SEU CONTEXTO',         desc:'IA processando padrões.',   motion:'órbita 2.6s',  hex:'#9C6CFF', src:ASSET+'orb-analisando.png',  anim:'pl-orbit 2.6s linear infinite',      halo:'pl-halo 2.2s ease-in-out infinite',    ga:.34, ta:.08,  la:.24},
 {id:'rel',tag:'RELAXAMENTO · DESACELERE',        desc:'Momento de desacelerar.',   motion:'respiro 8s',   hex:'#22D3EE', src:ASSET+'orb-relaxamento.png', anim:'pl-breathe 8s ease-in-out infinite', halo:'pl-halo-slow 8s ease-in-out infinite', ga:.32, ta:.075, la:.2}
];
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

/* ===== CONTEXTO DO ATLETA =====
   Snapshot REAL do Garmin (2026-08-01), gerado por tools/garmin-to-ctx.mjs.
   Serve de fallback; applyContext() sobrescreve com data/context.json quando disponível. */
var CTX={
 name:'Lucas', asOf:'2026-08-01', source:'garmin',
 hrv:{val:'34', unit:'ms', delta:-11, balanced:true, baseline:38},
 sleep:{val:'7h01', deltaMin:-39, score:74},
 load:{acute:503, chronic:241, acwr:2, status:'muito alta', high:true},
 recovery:{pct:63, status:'baixa'},
 lastWorkout:{name:'pedal em Z2 de 1h20', when:'hoje', sport:'pedal', hard:false, broke:false, pr:false}
};
/* Respostas da IA — geradas a partir do contexto (mock; no produto é o serviço de IA) */
function reply(k){var c=CTX, neg=c.hrv?Math.abs(c.hrv.delta):0;
 if(k==='hrv'&&!c.hrv) k='load'; /* fonte sem HRV: cai para a leitura de carga */
 if(k==='broke')return{head:'Você não quebrou — a conta chegou.', text:'No seu '+c.lastWorkout.name+' de '+c.lastWorkout.when+', a carga aguda estava em '+c.load.acute+' e o HRV '+c.hrv.delta+'%. O corpo pediu mais do que tinha pra dar — é fadiga acumulada, não falta de preparo. Hoje, movimento leve te devolve mais do que insistir.'};
 if(k==='pr')return{head:'Vamos proteger esse ganho.', text:'Você foi além no '+c.lastWorkout.name+'. Pra virar marca nova sem lesão, os próximos dias pedem volume fácil e sono — o ganho se consolida no descanso, não repetindo o esforço.'};
 if(k==='hrv')return{head:'O HRV não é o alerta de hoje.', text:'Ele caiu '+neg+'% ante a sua média da semana ('+c.hrv.baseline+'ms), mas segue na sua faixa de equilíbrio — recuperou bem nos últimos dias. O sinal que pesa hoje é a carga: '+c.load.acute+' de aguda, ACWR '+(+c.load.acwr).toFixed(1).replace('.',',')+'. Não é lesão nem doença — é conta a pagar com um dia leve.'};
 if(k==='sleep')return{head:'Uma noite abaixo, dentro do esperado.', text:'Você dormiu '+c.sleep.val+' — '+Math.abs(c.sleep.deltaMin)+' min a menos que sua média recente. Não é crítico sozinho, mas somado à carga alta, é o argumento pra hoje ser regenerativo. Uma noite de 8h devolve a folga.'};
 if(k==='load')return{head:'É o momento de segurar, não de subir.', text:'Sua carga aguda ('+c.load.acute+') está '+c.load.status+': ACWR '+(+c.load.acwr).toFixed(1).replace('.',',')+', mais que o dobro da sua base crônica ('+c.load.chronic+'). O Garmin já te marca como "overreaching". Não precisa parar — precisa alternar. Um dia leve agora evita uma semana perdida depois.'};
 if(k==='tomorrow')return{head:'Amanhã, com teto.', text:'Se a carga ceder e o HRV seguir equilibrado, libero 50–60 min fáceis. Nada de blocos fortes enquanto o ACWR estiver acima de 1,5. Te confirmo às 6h30, com o dado da noite.'};
 if(k==='plan')return{head:'Podemos ajustar agora.', text:'Sua semana tem 2 sessões restantes. Posso trocar a sessão de força por mobilidade, ou mover o bloco forte para sexta. O que faz mais sentido para você?'};
 return{head:'Anotado — e isso muda a leitura.', text:'Recalculei com esse contexto. A decisão de hoje continua sendo movimento leve, mas antecipei sua sessão forte para quinta. Amanhã cedo eu te aviso se o seu HRV confirmar.'};
}
/* Sugestões de pergunta — dinâmicas conforme o que é relevante hoje */
function contextChips(){var c=CTX, out=[];
 if(c.lastWorkout&&c.lastWorkout.broke) out.push({label:'Por que quebrei no treino de '+c.lastWorkout.when+'?', kind:'broke'});
 if(c.lastWorkout&&c.lastWorkout.pr)    out.push({label:'Como treinar pra melhorar minha marca?', kind:'pr'});
 if(c.hrv&&c.hrv.delta<0)               out.push({label:'Por que meu HRV caiu?', kind:'hrv'});
 if(c.load.high)                        out.push({label:'Estou treinando demais?', kind:'load'});
 if(c.sleep.deltaMin<0)                 out.push({label:'Como melhorar meu sono?', kind:'sleep'});
 out.push({label:'E amanhã?', kind:'tomorrow'});
 var seen={}, res=[]; for(var i=0;i<out.length&&res.length<3;i++){ if(!seen[out[i].kind]){seen[out[i].kind]=1;res.push(out[i]);} }
 return res;
}

var NAME=CTX.name;
var S={tab:'chat', st:0, draft:'', thinking:false, accepted:false, info:false, messages:[
 {id:1, user:true, text:'Posso fazer um treino intenso hoje?', time:'09:36'},
 {id:2, ai:true, card:true, head:'Hoje, não.', text:'Sua recuperação ainda não está ideal — e eu prefiro te devolver a semana inteira do que um treino forte hoje.'}
]};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function orb(size,haloInset,haloBlur){var s=STATES[S.st];
 return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex:none">'+
  '<div style="position:absolute;inset:-'+haloInset+'%;border-radius:50%;background:radial-gradient(circle,var(--st-glow) 0%,transparent '+(size>40?68:70)+'%);filter:blur('+haloBlur+'px);animation:var(--st-halo)"></div>'+
  '<img src="'+s.src+'" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;animation:var(--st-motion)"/></div>';}

function tab(name,label){var on=S.tab===name;
 if(on)return '<div style="position:relative;padding-bottom:11px;font:500 14px/1 \'Hanken Grotesk\',sans-serif;color:#F2F4F3"><span>'+label+'</span><div style="position:absolute;left:0;right:0;bottom:0;height:1.5px;border-radius:2px;background:var(--st);box-shadow:0 0 12px var(--st-glow)"></div></div>';
 return '<div onclick="plGo(\''+name+'\')" style="padding-bottom:11px;font:400 14px/1 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.32);cursor:pointer">'+label+'</div>';}

function metric(k,val,unit,delta,useSt){
 return '<div><div style="font:300 9px/1 \'JetBrains Mono\',monospace;letter-spacing:.12em;color:rgba(255,255,255,.3)">'+k+'</div>'+
  '<div style="margin-top:9px;font:400 17px/1 \'Hanken Grotesk\',sans-serif;color:'+(useSt?'var(--st)':'rgba(255,255,255,.88)')+'">'+val+(unit?'<span style="font-size:10px;'+(useSt?'opacity:.55':'color:rgba(255,255,255,.35)')+'">'+unit+'</span>':'')+'</div>'+
  '<div style="margin-top:6px;font:300 9.5px/1 \'JetBrains Mono\',monospace;color:rgba(255,255,255,.3)">'+delta+'</div></div>';}

function reason(color,title,sub){
 return '<div style="display:flex;gap:12px;align-items:flex-start"><div style="width:6px;height:6px;border-radius:50%;background:'+color+';box-shadow:0 0 8px '+color+'B3;margin-top:6px;flex:none"></div>'+
  '<div><div style="font:500 14px/1.3 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.9)">'+title+'</div><div style="margin-top:4px;font:300 12.5px/1.4 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.38)">'+sub+'</div></div></div>';}

function infoIcon(){
 return '<div onclick="plInfo(1)" style="cursor:pointer;color:rgba(255,255,255,.38);display:flex;flex:none" aria-label="O que significam estes números"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.6" r=".7" fill="currentColor" stroke="none"/></svg></div>';}

function card(){var c=CTX;
 var sug='<div style="margin-top:22px;padding:20px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.02) 100%);border:1px solid rgba(255,255,255,.075);backdrop-filter:blur(30px)">'+
  '<div style="display:flex;align-items:center;gap:8px"><div style="width:5px;height:5px;border-radius:50%;background:var(--st);box-shadow:0 0 7px var(--st)"></div><span style="font:400 9.5px/1 \'JetBrains Mono\',monospace;letter-spacing:.16em;color:rgba(255,255,255,.4)">SUGESTÃO PARA HOJE</span></div>'+
  '<div style="margin-top:14px;font:400 21px/1.2 \'Instrument Serif\',Georgia,serif;color:#F4F6F5">Treino regenerativo</div>'+
  '<div style="margin-top:8px;font:300 13.5px/1.5 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.5)">Bike Z2 · 60–75 min · movimento que acelera a recuperação, não a consome.</div>'+
  (S.accepted
   ? '<div style="display:flex;align-items:center;gap:9px;margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--st-tint);border:1px solid var(--st-line)"><div style="width:5px;height:5px;border-radius:50%;background:var(--st)"></div><span style="font:400 10px/1 \'JetBrains Mono\',monospace;letter-spacing:.12em;color:var(--st)">NO PLANO DE HOJE · 07:30</span></div>'
   : '<div style="display:flex;gap:9px;margin-top:18px"><div onclick="plAccept()" style="flex:1;text-align:center;padding:12px 0;border-radius:14px;background:var(--st);font:500 13.5px/1 \'Hanken Grotesk\',sans-serif;color:#04120A;cursor:pointer;box-shadow:0 6px 22px var(--st-glow)">Aceitar</div><div style="flex:1;text-align:center;padding:12px 0;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font:400 13.5px/1 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.62);cursor:pointer">Outra opção</div></div>')+
  '</div>';
 var hrvReason = !c.hrv
   ? reason('#63D471','Prontidão por sono + carga','Health Connect não traz HRV — leitura por sono e carga')
   : c.hrv.balanced
   ? reason('#63D471','HRV equilibrado','Recuperou ao longo da semana — base em '+c.hrv.baseline+'ms')
   : reason('#63D471','HRV abaixo do ideal','Seu sistema nervoso precisa de mais tempo');
 return '<div style="margin-top:24px;display:flex;flex-direction:column;gap:16px">'+
   reason('#9C6CFF','Carga '+c.load.status,'ACWR '+(+c.load.acwr).toFixed(1).replace('.',',')+' — acima do dobro da sua base ('+c.load.chronic+')')+
   hrvReason+
   reason('#5DA8FF','Sono abaixo da média',Math.abs(c.sleep.deltaMin)+' min a menos que sua média recente')+
  '</div>'+
  '<div style="display:flex;align-items:center;gap:12px;margin:24px 0 0"><div style="flex:1;height:1px;background:rgba(255,255,255,.07)"></div>'+infoIcon()+'</div>'+
  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:18px 0 20px">'+
   (c.hrv?metric('HRV',c.hrv.val,c.hrv.unit,(c.hrv.delta<0?'−':'+')+Math.abs(c.hrv.delta)+'%',false):metric('HRV','—','','sem HRV',false))+
   metric('SONO',c.sleep.val.replace('h','<span style=\"font-size:10px;color:rgba(255,255,255,.35)\">h</span>'),'',(c.sleep.deltaMin<0?'−':'+')+Math.abs(c.sleep.deltaMin)+'min',false)+
   metric('CARGA',''+c.load.acute,'',c.load.status,false)+
   metric('RECUP.',''+c.recovery.pct,'%',c.recovery.status,true)+
  '</div>'+
  '<div style="height:1px;background:rgba(255,255,255,.07)"></div>'+
  sug+
  '<div style="margin-top:14px;font:300 9.5px/1.5 \'JetBrains Mono\',monospace;letter-spacing:.09em;color:rgba(255,255,255,.22)">LEITURA: HRV 7D · SONO 3N · CARGA 14D</div>';}

function chatScreen(){var s=STATES[S.st];var h='';
 h+='<div style="padding:32px 0 0;display:flex;gap:16px;align-items:flex-start">'+
   '<div onclick="plCycle()" style="cursor:pointer;margin-top:2px">'+orb(52,45,9)+'</div>'+
   '<div style="flex:1;min-width:0"><h1 style="margin:0;font:400 36px/1.06 \'Instrument Serif\',Georgia,serif;letter-spacing:-.01em;color:#F4F6F5">Bom dia, '+esc(NAME)+'.</h1>'+
   '<p style="margin:9px 0 0;font:300 15px/1.5 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.42)">Como você está se sentindo hoje?</p></div></div>';
 h+='<div style="display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:7px 12px 7px 10px;border-radius:999px;background:var(--st-tint);border:1px solid var(--st-line)"><div style="width:6px;height:6px;border-radius:50%;background:var(--st);box-shadow:0 0 8px var(--st);animation:var(--st-motion)"></div><span style="font:400 10px/1 \'JetBrains Mono\',monospace;letter-spacing:.14em;color:var(--st)">'+s.tag+'</span></div>';
 h+='<div style="height:28px"></div>';
 S.messages.forEach(function(m){
  h+='<div style="animation:pl-in .5s cubic-bezier(.2,.7,.3,1) both">';
  if(m.user){h+='<div style="display:flex;justify-content:flex-end;margin-bottom:26px"><div style="max-width:80%"><div style="padding:13px 16px;border-radius:20px 20px 6px 20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(20px);font:400 15px/1.45 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.92)">'+esc(m.text)+'</div><div style="margin-top:7px;text-align:right;font:300 9.5px/1 \'JetBrains Mono\',monospace;letter-spacing:.1em;color:rgba(255,255,255,.24)">'+esc(m.time)+'</div></div></div>';}
  else{h+='<div style="margin-bottom:30px"><h2 style="margin:0;font:400 27px/1.18 \'Instrument Serif\',Georgia,serif;letter-spacing:-.01em;color:#F4F6F5">'+esc(m.head)+'</h2><p style="margin:12px 0 0;font:300 15px/1.6 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.58)">'+esc(m.text)+'</p>'+(m.card?card():'')+'</div>';}
  h+='</div>';});
 if(S.thinking){h+='<div style="display:flex;align-items:center;gap:11px;margin-bottom:30px;animation:pl-in .4s ease both"><div style="display:flex;gap:4px"><div style="width:5px;height:5px;border-radius:50%;background:var(--st);animation:pl-dot 1.1s ease-in-out infinite"></div><div style="width:5px;height:5px;border-radius:50%;background:var(--st);animation:pl-dot 1.1s ease-in-out .18s infinite"></div><div style="width:5px;height:5px;border-radius:50%;background:var(--st);animation:pl-dot 1.1s ease-in-out .36s infinite"></div></div><span style="font:400 10px/1 \'JetBrains Mono\',monospace;letter-spacing:.14em;color:rgba(255,255,255,.4)">LENDO SEU CONTEXTO</span></div>';}
 h+='<div style="height:4px"></div>';
 return h;}

function insightBlock(color,kicker,claim,evid,btn){
 return '<div style="padding:24px 0"><div style="display:flex;align-items:center;gap:8px"><div style="width:5px;height:5px;border-radius:50%;background:'+color+'"></div><span style="font:300 9.5px/1 \'JetBrains Mono\',monospace;letter-spacing:.14em;color:rgba(255,255,255,.34)">'+kicker+'</span></div>'+
  '<p style="margin:13px 0 0;font:400 20px/1.35 \'Instrument Serif\',Georgia,serif;color:#EFF2F0">'+claim+'</p>'+
  '<p style="margin:10px 0 0;font:300 13px/1.5 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.4)">'+evid+'</p>'+
  (btn?'<div onclick="plAsk(\'Como melhorar meu sono?\',\'sleep\')" style="display:inline-block;margin-top:15px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font:400 12.5px/1 \'Hanken Grotesk\',sans-serif;color:rgba(255,255,255,.7);cursor:pointer">Conversar sobre isso</div>':'')+'</div>';}

function insightsScreen(){
 return '<div style="padding:32px 0 20px">'+
  '<div style="font:400 9.5px/1 \'JetBrains Mono\',monospace;letter-spacing:.16em;color:rgba(255,255,255,.32)">PADRÕES · ÚLTIMAS 6 SEMANAS</div>'+
  '<h1 style="margin:16px 0 0;font:400 33px/1.12 \'Instrument Serif\',Georgia,serif;letter-spacing:-.01em;color:#F4F6F5">A IA encontrou três coisas sobre você.</h1>'+
  '<div style="margin-top:32px;height:1px;background:rgba(255,255,255,.07)"></div>'+
  insightBlock('#5DA8FF','SONO · CONFIANÇA ALTA','Seu sono influencia diretamente sua performance.','Quando você dorme mais de 7h, sua consistência aumenta 23%.',true)+
  '<div style="height:1px;background:rgba(255,255,255,.07)"></div>'+
  insightBlock('#63D471','RECUPERAÇÃO · CONFIANÇA ALTA','Treinos regenerativos fazem grande diferença para você.','Sua recuperação melhora 32% quando inclui pelo menos um por semana.',false)+
  '<div style="height:1px;background:rgba(255,255,255,.07)"></div>'+
  insightBlock('#FFBA2A','RITMO · CONFIANÇA MÉDIA','Você performa melhor quando treina pela manhã.','Seu corpo responde melhor a estímulos entre 06h e 10h.',false)+
  '<div style="height:1px;background:rgba(255,255,255,.07)"></div>'+

function plGo(t){S.tab=t;render();}
function plCycle(){S.st=(S.st+1)%STATES.length;render();}
function plAccept(){S.accepted=true;render();}
function plInfo(v){S.info=!!v;render();}
function plChip(i){var x=(window.__chips||[])[i]; if(x)plAsk(x.label,x.kind);}
function plAsk(text,kind){var id=Date.now();
 S.messages.push({id:id,user:true,text:text,time:'09:41'});S.draft='';S.thinking=true;S.st=4;S.tab='chat';S.info=false;render();
 setTimeout(function(){var r=reply(kind);S.thinking=false;S.st=0;S.messages.push({id:id+1,ai:true,head:r.head,text:r.text});render();},1900);}
function plSend(){var t=(S.draft||'').trim();if(t)plAsk(t,'generic');}

/* ===== Fiação de dados reais =====
   Sobrescreve o CTX embutido com data/context.json (produzido por tools/garmin-to-ctx.mjs
   a partir do Garmin/Health Connect). Se não houver arquivo, mantém o snapshot real de fallback. */
function applyContext(ctx){ if(!ctx||typeof ctx!=='object')return false;
 Object.keys(ctx).forEach(function(k){CTX[k]=ctx[k];}); NAME=CTX.name; return true; }

(function loadContext(){
 var HC=window.CopilotoHC;
 /* No Android (nativo): lê do Health Connect — pede permissão, monta o CTX real do device. */
 if(HC && HC.isNative()){
  HC.buildContext({days:42})
   .then(function(ctx){ if(applyContext(ctx))render(); })
   .catch(function(e){ console.log('Health Connect indisponível — usando fallback:', e&&e.message); });
  return;
 }
 /* No preview/web: usa data/context.json (ou o CTX embutido). */
 try{
  if(location.protocol.indexOf('cowork-artifact')===0) return; /* preview sandbox: usa CTX embutido */
  fetch('data/context.json',{cache:'no-store'})
   .then(function(r){return r.ok?r.json():null;})
   .then(function(j){ if(applyContext(j))render(); })
   .catch(function(){});
 }catch(e){}
})();

render();
